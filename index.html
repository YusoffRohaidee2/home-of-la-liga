<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home of LALIGA | Sports Hub Official</title>

    <link rel="icon" href="https://assets.laliga.com/assets/logos/LL_RGB_h_color/LL_RGB_h_color.png" type="image/png">

    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyberDark: '#070a12',
                        cyberCard: 'rgba(15, 23, 42, 0.75)',
                        laligaRed: '#ff004b',
                        neonCyan: '#00f0ff',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        tech: ['Orbitron', 'sans-serif'],
                    },
                    boxShadow: {
                        'glow-red': '0 0 20px rgba(255, 0, 75, 0.4)',
                        'glow-cyan': '0 0 20px rgba(0, 240, 255, 0.3)',
                    }
                }
            }
        }
    </script>
    
    <!-- Video.js CSS & JS -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    
    <style>
        body {
            background-color: #070a12;
            color: #f3f4f6;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 0, 75, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* Subtle Cyber Grid lines */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: 32px 32px;
            background-image: 
                linear-gradient(to right, rgba(255, 0, 75, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 0, 75, 0.03) 1px, transparent 1px);
            pointer-events: none;
            z-index: 0;
        }

        /* Custom Video.js Styling */
        .video-js {
            border-radius: 1rem;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #000;
        }

        .video-js .vjs-big-play-button {
            background-color: rgba(255, 0, 75, 0.85) !important;
            border: 2px solid #ff004b !important;
            color: #ffffff !important;
            border-radius: 50% !important;
            width: 70px !important;
            height: 70px !important;
            line-height: 66px !important;
            margin-top: -35px !important;
            margin-left: -35px !important;
            box-shadow: 0 0 25px rgba(255, 0, 75, 0.6);
            transition: all 0.3s ease;
        }

        .video-js:hover .vjs-big-play-button {
            transform: scale(1.1);
            background-color: #ff004b !important;
            box-shadow: 0 0 35px rgba(255, 0, 75, 0.9);
        }

        .video-js .vjs-play-progress {
            background-color: #ff004b;
        }

        /* LIVE Pulse Dot */
        @keyframes pulseGlow {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        .live-dot {
            animation: pulseGlow 1.6s infinite ease-in-out;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #070a12;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff004b;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased text-gray-100 relative">

    <!-- Header Navigation -->
    <header class="border-b border-gray-800/80 bg-slate-950/80 backdrop-blur-xl sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl overflow-hidden flex items-center justify-center p-1 bg-white/10 border border-laligaRed/40 shadow-glow-red">
                    <img src="https://assets.laliga.com/assets/logos/LL_RGB_h_color/LL_RGB_h_color.png" alt="LaLiga Logo" class="w-full h-full object-contain">
                </div>
                <div>
                    <h1 class="font-tech text-base sm:text-lg font-extrabold tracking-wider text-white">
                        HOME OF <span class="text-laligaRed">LALIGA</span>
                    </h1>
                    <p class="text-[10px] text-neonCyan font-semibold tracking-wider uppercase">Sports Hub Official</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-[11px] font-tech font-bold bg-rose-950/60 text-rose-400 border border-rose-800/60 shadow-glow-red">
                    <span class="w-2 h-2 rounded-full bg-rose-500 live-dot mr-2"></span>
                    LIVE
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6 space-y-6 relative z-10">

        <!-- Top Dropdown Channel Switcher -->
        <section class="bg-cyberCard rounded-2xl p-4 border border-gray-800/80 backdrop-blur-md shadow-2xl flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="p-2.5 bg-rose-950/40 rounded-xl text-laligaRed border border-laligaRed/30">
                    <i class="fa-solid fa-tv text-lg"></i>
                </div>
                <div>
                    <label for="channelSelect" class="block text-[10px] font-tech text-gray-400 uppercase tracking-widest">Channel Stream</label>
                    <span id="currentChannelDisplay" class="text-sm font-bold text-white tracking-wide">T-Sports FHD</span>
                </div>
            </div>

            <!-- Custom Select Input -->
            <div class="relative w-full sm:w-80">
                <select id="channelSelect" class="w-full bg-slate-900 text-white font-semibold text-xs sm:text-sm rounded-xl border border-gray-700 hover:border-laligaRed focus:border-laligaRed focus:ring-1 focus:ring-laligaRed p-3 pr-10 appearance-none cursor-pointer transition-all outline-none">
                    <!-- Dynamic Options Populated by JS -->
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-laligaRed">
                    <i class="fa-solid fa-chevron-down text-xs"></i>
                </div>
            </div>
        </section>

        <!-- Player Container -->
        <section class="bg-black rounded-2xl overflow-hidden border border-gray-800/80 shadow-2xl relative">
            <div class="p-3 bg-slate-950 border-b border-gray-800/80 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <span id="playerTypeBadge" class="px-2.5 py-0.5 bg-laligaRed/20 text-laligaRed border border-laligaRed/40 text-[10px] font-tech font-bold rounded">
                        HLS HD
                    </span>
                    <span id="streamTitleTag" class="text-xs font-semibold text-gray-200">
                        T-Sports FHD
                    </span>
                </div>
                <button id="reloadBtn" class="text-gray-400 hover:text-white bg-slate-900 px-2.5 py-1 rounded-lg text-xs border border-gray-800 transition flex items-center gap-1.5" title="Reload Stream">
                    <i class="fa-solid fa-rotate text-[10px]"></i> Reload
                </button>
            </div>

            <!-- Video Player Screen Wrapper -->
            <div class="w-full aspect-video relative bg-black">
                <video id="cyber-player" class="video-js vjs-big-play-centered vjs-fluid w-full h-full" controls preload="auto" crossorigin="anonymous">
                    <p class="vjs-no-js">JavaScript diperlukan untuk memutar siaran ini.</p>
                </video>
            </div>
        </section>

        <!-- Fast Channel Switcher Grid -->
        <section class="space-y-3">
            <h2 class="text-xs font-tech font-bold text-laligaRed uppercase tracking-widest flex items-center gap-2">
                <i class="fa-solid fa-bolt"></i> Quick Channel Switcher
            </h2>

            <div id="channelGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                <!-- Dynamically Generated Cards -->
            </div>
        </section>

    </main>

    <!-- Simple Footer -->
    <footer class="border-t border-gray-800/80 bg-slate-950 py-5 mt-auto text-center text-xs text-gray-500 font-sans">
        <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
            <p>&copy; 2026 <strong class="text-white">Home of LALIGA</strong> - <span class="text-laligaRed">Sports Hub Official</span></p>
            <p class="text-[10px] font-tech text-gray-500 tracking-wider">POWERED BY VIDEO.JS HLS FRAMEWORK</p>
        </div>
    </footer>

    <script>
        // Updated Stream Channel Source Data
        const channels = [
            {
                id: 0,
                name: "T-Sports FHD",
                url: "https://livetv.shamon-cable.net:8443/T-Sports-FHD/index.m3u8"
            }
        ];

        let vjsPlayer = null;
        let activeIndex = 0;

        document.addEventListener('DOMContentLoaded', () => {
            const selectEl = document.getElementById('channelSelect');
            const gridEl = document.getElementById('channelGrid');

            channels.forEach((ch, idx) => {
                // Populate Dropdown Options
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = `${idx + 1}. ${ch.name}`;
                selectEl.appendChild(opt);

                // Populate Grid Cards
                const card = document.createElement('button');
                card.id = `card-${idx}`;
                card.className = `channel-card group text-left bg-cyberCard border ${idx === 0 ? 'border-laligaRed shadow-glow-red' : 'border-gray-800/80'} p-3.5 rounded-xl transition-all duration-200 hover:border-laligaRed hover:bg-slate-900`;
                card.onclick = () => switchChannel(idx);
                card.innerHTML = `
                    <div class="flex items-center justify-between mb-1.5">
                        <span class="text-[10px] font-tech font-bold ${idx === 0 ? 'text-laligaRed' : 'text-gray-400'}">CH ${String(idx + 1).padStart(2, '0')}</span>
                        <span class="text-[9px] font-tech px-1.5 py-0.5 rounded bg-rose-950/60 text-rose-400 border border-rose-800/40">LIVE</span>
                    </div>
                    <h3 class="font-semibold text-white text-xs group-hover:text-laligaRed transition truncate">${ch.name}</h3>
                `;
                gridEl.appendChild(card);
            });

            // Initialize Video.js
            vjsPlayer = videojs('cyber-player', {
                autoplay: true,
                controls: true,
                responsive: true,
                fluid: true,
                liveui: true,
                html5: { vhs: { overrideNative: true } }
            });

            selectEl.addEventListener('change', (e) => {
                switchChannel(parseInt(e.target.value, 10));
            });

            document.getElementById('reloadBtn').addEventListener('click', () => {
                loadChannel(activeIndex);
            });

            // Play default first channel
            switchChannel(0);
        });

        function switchChannel(index) {
            if (index < 0 || index >= channels.length) return;
            activeIndex = index;

            document.getElementById('channelSelect').value = index;

            // Update Card Highlight States
            channels.forEach((_, idx) => {
                const card = document.getElementById(`card-${idx}`);
                if (!card) return;
                const chNum = card.querySelector('span');

                if (idx === index) {
                    card.className = "channel-card group text-left bg-cyberCard border border-laligaRed shadow-glow-red p-3.5 rounded-xl transition-all duration-200";
                    if (chNum) chNum.className = "text-[10px] font-tech font-bold text-laligaRed";
                } else {
                    card.className = "channel-card group text-left bg-cyberCard border border-gray-800/80 p-3.5 rounded-xl transition-all duration-200 hover:border-laligaRed hover:bg-slate-900";
                    if (chNum) chNum.className = "text-[10px] font-tech font-bold text-gray-400";
                }
            });

            loadChannel(index);
        }

        function loadChannel(index) {
            const ch = channels[index];
            document.getElementById('currentChannelDisplay').textContent = ch.name;
            document.getElementById('streamTitleTag').textContent = ch.name;

            if (vjsPlayer) {
                vjsPlayer.pause();
                vjsPlayer.src({
                    src: ch.url,
                    type: 'application/x-mpegURL'
                });
                vjsPlayer.load();
                vjsPlayer.play().catch(err => console.log("Autoplay memerlukan interaksi pengguna:", err));
            }
        }
    </script>
</body>
</html>
